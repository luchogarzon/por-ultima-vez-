a · luminosa · cálida · acento naranja\n   Inspiración de layout: experiencias \"todo incluido\" premium\n   Tipografía: Poppins (300–800)\n   ========================================================= */\n\n/* ---------- Tokens ---------- */\n:root{\n  --cream:    #f6f2ec;   /* fondo claro principal */\n  --cream-2:  #fbf8f3;   /* secciones blancas cálidas */\n  --card:     #ffffff;   /* tarjetas */\n  --ink:      #18140f;   /* texto / secciones oscuras */\n  --ink-2:    #211c16;\n  --ink-3:    #2c2620;\n  --text:     #26211b;   /* texto sobre claro */\n  --muted:    #756d63;   /* texto secundario claro */\n  --muted-d:  #b9b1a6;   /* texto secundario oscuro */\n  --line:     #e6ded2;   /* bordes claros */\n  --line-d:   #38322a;   /* bordes oscuros */\n\n  --orange:   #ef8a1f;   /* acento primario */\n  --orange-d: #e0701a;   /* naranja profundo (hover) */\n  --red:      #e23b2e;   /* energía, uso puntual */\n  --amber:    #ffb020;\n\n  --wa:       #25d366;\n\n  --sans: \"Poppins\", system-ui, -apple-system, sans-serif;\n\n  --container: 1200px;\n  --radius:   16px;\n  --radius-lg:24px;\n  --ease: cubic-bezier(.22,.61,.36,1);\n  --shadow:   0 18px 50px -22px rgba(40,30,15,.30);\n  --shadow-sm:0 10px 30px -16px rgba(40,30,15,.25);\n}\n\n/* ---------- Reset ---------- */\n*{ box-sizing:border-box; margin:0; padding:0; }\nhtml{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }\nbody{\n  background:var(--cream);\n  color:var(--text);\n  font-family:var(--sans);\n  font-size:17px;\n  font-weight:400;\n  line-height:1.65;\n  overflow-x:hidden;\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n}\nimg{ display:block; max-width:100%; }\na{ color:inherit; text-decoration:none; }\nbutton{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }\n::selection{ background:var(--orange); color:#fff; }\n\n::-webkit-scrollbar{ width:11px; }\n::-webkit-scrollbar-track{ background:var(--cream); }\n::-webkit-scrollbar-thumb{ background:#d9cfc0; border-radius:20px; border:3px solid var(--cream); }\n::-webkit-scrollbar-thumb:hover{ background:#c9bda9; }\n\n/* ---------- Layout helpers ---------- */\n.container{ width:100%; max-width:var(--container); margin:0 auto; padding:0 28px; }\n.section{ padding:clamp(64px, 8.5vw, 120px) 0; position:relative; }\n.section--cream{ background:var(--cream); }\n.section--white{ background:var(--cream-2); }\n.section--dark{ background:var(--ink); color:#f1ebe3; }\n\n/* Accent word (palabra naranja itálica) — firma visual */\n.ac{ color:var(--orange); font-style:italic; font-weight:700; }\n\n/* Eyebrow */\n.eyebrow{\n  display:inline-flex; align-items:center; gap:10px;\n  font-size:13px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;\n  color:var(--orange);\n  margin-bottom:18px;\n}\n.eyebrow::before{ content:\"\"; width:26px; height:2px; background:var(--orange); }\n.eyebrow--center{ justify-content:center; }\n\n/* Headlines */\n.title{\n  font-weight:300;\n  font-size:clamp(30px, 4.6vw, 54px);\n  line-height:1.08;\n  letter-spacing:-.015em;\n  color:var(--text);\n}\n.section--dark .title{ color:#fff; }\n.title-sm{\n  font-weight:300;\n  font-size:clamp(26px, 3.4vw, 40px);\n  line-height:1.12;\n  letter-spacing:-.01em;\n}\n.sub{\n  font-size:clamp(16px, 1.6vw, 19px);\n  color:var(--muted);\n  line-height:1.65;\n  max-width:60ch;\n}\n.section--dark .sub{ color:var(--muted-d); }\n\n.head{ max-width:760px; }\n.head--center{ margin:0 auto; text-align:center; }\n.head--center .eyebrow{ justify-content:center; }\n.head .sub{ margin-top:18px; }\n.head--center .sub{ margin-left:auto; margin-right:auto; }\n.head{ margin-bottom:clamp(40px,5vw,60px); }\n\n/* ---------- Buttons ---------- */\n.btn{\n  display:inline-flex; align-items:center; justify-content:center; gap:10px;\n  font-weight:600; font-size:15px; letter-spacing:.01em;\n  padding:15px 30px; border-radius:100px;\n  transition:transform .25s var(--ease), box-shadow .25s var(--ease), background .25s, color .25s, border-color .25s;\n  white-space:nowrap; line-height:1;\n}\n.btn svg{ width:18px; height:18px; flex:none; }\n.btn--orange{ background:var(--orange); color:#fff; box-shadow:0 12px 26px -12px rgba(239,138,31,.7); }\n.btn--orange:hover{ background:var(--orange-d); transform:translateY(-2px); box-shadow:0 18px 34px -12px rgba(239,138,31,.8); }\n.btn--dark{ background:var(--ink); color:#fff; }\n.btn--dark:hover{ background:var(--ink-3); transform:translateY(-2px); }\n.btn--light{ background:#fff; color:var(--ink); box-shadow:var(--shadow-sm); }\n.btn--light:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }\n.btn--outline{ border:1.5px solid rgba(255,255,255,.65); color:#fff; }\n.btn--outline:hover{ background:#fff; color:var(--ink); border-color:#fff; transform:translateY(-2px); }\n.btn--outline-dark{ border:1.5px solid var(--line); color:var(--text); }\n.btn--outline-dark:hover{ border-color:var(--ink); transform:translateY(-2px); }\n.btn--wa{ background:var(--wa); color:#04210f; box-shadow:0 12px 26px -12px rgba(37,211,102,.7); }\n.btn--wa:hover{ transform:translateY(-2px); box-shadow:0 18px 34px -12px rgba(37,211,102,.8); }\n.btn--lg{ padding:18px 38px; font-size:16px; }\n\n/* ---------- Header ---------- */\n.header{\n  position:fixed; top:0; left:0; right:0; z-index:100;\n  transition:background .35s, box-shadow .35s, padding .35s;\n  padding:8px 0;\n}\n.header.scrolled{ background:rgba(251,248,243,.92); backdrop-filter:blur(16px) saturate(140%); box-shadow:0 6px 24px -18px rgba(40,30,15,.5); }\n.header__inner{ display:flex; align-items:center; justify-content:space-between; height:68px; }\n.nav{ display:flex; align-items:center; gap:30px; }\n.nav a{ font-size:15px; font-weight:600; color:#fff; transition:color .2s, opacity .2s; opacity:.92; }\n.nav a:hover{ color:var(--orange); opacity:1; }\n.header.scrolled .nav a{ color:var(--text); }\n.header.scrolled .nav a:hover{ color:var(--orange); }\n.header__cta{ display:flex; align-items:center; gap:14px; }\n\n/* Logo */\n.logo{ display:flex; align-items:center; gap:11px; flex:none; line-height:1; }\n.logo__mark{\n  width:42px; height:42px; flex:none; border-radius:50%;\n  display:grid; place-items:center;\n  background:var(--orange); color:#fff;\n  font-weight:800; font-size:17px; letter-spacing:-.02em;\n  box-shadow:0 6px 16px -6px rgba(239,138,31,.7);\n}\n.logo__word{ display:flex; flex-direction:column; white-space:nowrap; }\n.logo__word b{ font-weight:800; font-size:16px; letter-spacing:.01em; color:#fff; line-height:1; }\n.logo__word small{ font-size:9px; font-weight:600; letter-spacing:.22em; color:rgba(255,255,255,.7); margin-top:3px; }\n.header.scrolled .logo__word b{ color:var(--text); }\n.header.scrolled .logo__word small{ color:var(--muted); }\n\n/* Burger */\n.burger{ display:none; width:46px; height:46px; border:1px solid rgba(255,255,255,.4); border-radius:12px; }\n.header.scrolled .burger{ border-color:var(--line); }\n.burger span{ display:block; width:20px; height:2px; background:#fff; margin:4px auto; transition:.3s; }\n.header.scrolled .burger span{ background:var(--ink); }\n.burger.open span:nth-child(1){ transform:translateY(6px) rotate(45deg); }\n.burger.open span:nth-child(2){ opacity:0; }\n.burger.open span:nth-child(3){ transform:translateY(-6px) rotate(-45deg); }\n\n/* Mobile menu */\n.mobile-menu{\n  position:fixed; inset:0; z-index:99; background:var(--ink);\n  display:flex; flex-direction:column; justify-content:center; gap:4px;\n  padding:80px 28px 40px;\n  transform:translateY(-100%); transition:transform .45s var(--ease); visibility:hidden;\n}\n.mobile-menu.open{ transform:translateY(0); visibility:visible; }\n.mobile-menu a{ font-weight:600; font-size:clamp(24px,7vw,34px); color:#fff; padding:8px 0; }\n.mobile-menu a span{ color:var(--orange); font-size:14px; font-weight:700; margin-right:14px; }\n.mobile-menu .btn{ margin-top:22px; }\n\n/* ---------- Hero ---------- */\n.hero{ position:relative; min-height:100svh; display:flex; align-items:center; text-align:center; overflow:hidden; }\n.hero__bg{ position:absolute; inset:0; z-index:0; }\n.hero-slide{ position:absolute; inset:0; opacity:0; transition:opacity 1.3s ease; }\n.hero-slide.active{ opacity:1; }\n.hero-slide image-slot{ width:100%; height:100%; }\n.hero-slide.active image-slot{ animation:kenburns 8s ease-in-out infinite alternate; }\n@keyframes kenburns{ from{ transform:scale(1); } to{ transform:scale(1.1); } }\n.hero__dots{ position:absolute; bottom:74px; left:50%; transform:translateX(-50%); z-index:3; display:flex; gap:10px; }\n.hero__dots button{ width:11px; height:11px; border-radius:50%; background:rgba(255,255,255,.45); border:1.5px solid rgba(255,255,255,.6); transition:background .3s, width .3s, border-radius .3s; padding:0; }\n.hero__dots button.on{ background:var(--orange); border-color:var(--orange); width:30px; border-radius:6px; }\n.hero__overlay{\n  position:absolute; inset:0; z-index:1;\n  background:\n    linear-gradient(to bottom, rgba(15,22,40,.55) 0%, rgba(15,15,20,.25) 35%, rgba(10,10,12,.78) 100%);\n}\n.hero__inner{ position:relative; z-index:2; width:100%; padding-top:80px; }\n.hero__eyebrow{\n  display:inline-flex; align-items:center; gap:9px;\n  font-size:13px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:#fff;\n  background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.28);\n  padding:8px 16px; border-radius:100px; backdrop-filter:blur(6px); margin-bottom:26px;\n}\n.hero__eyebrow b{ color:var(--orange); }\n.hero h1{\n  font-weight:700; color:#fff;\n  font-size:clamp(40px, 7.2vw, 88px);\n  line-height:1.02; letter-spacing:-.02em;\n  max-width:15ch; margin:0 auto 22px;\n  text-shadow:0 2px 30px rgba(0,0,0,.35);\n}\n.hero h1 .ac{ font-weight:700; }\n.hero__sub{ color:rgba(255,255,255,.92); font-size:clamp(16px,1.9vw,21px); max-width:58ch; margin:0 auto; line-height:1.55; text-shadow:0 1px 16px rgba(0,0,0,.4); }\n.hero__actions{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:36px; }\n.scroll-hint{ position:absolute; bottom:24px; left:50%; transform:translateX(-50%); z-index:2; display:flex; flex-direction:column; align-items:center; gap:8px; color:rgba(255,255,255,.8); font-size:11px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; }\n.scroll-hint .arrow{ width:22px; height:22px; border-right:2px solid var(--orange); border-bottom:2px solid var(--orange); transform:rotate(45deg); animation:bounce 1.8s infinite; }\n@keyframes bounce{ 0%,100%{ transform:rotate(45deg) translate(0,0); } 50%{ transform:rotate(45deg) translate(4px,4px); } }\n\n/* ---------- Testimonios (tira) ---------- */\n.tstrip{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }\n.tcard{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:26px 26px 24px; box-shadow:var(--shadow-sm); }\n.tcard__top{ display:flex; align-items:center; gap:14px; margin-bottom:16px; }\n.tcard__av{ width:52px; height:52px; border-radius:50%; overflow:hidden; flex:none; border:2px solid var(--line); }\n.tcard__av image-slot{ width:100%; height:100%; }\n.tcard__top b{ font-weight:700; font-size:15.5px; display:block; line-height:1.2; }\n.tcard__top span{ font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:5px; }\n.tcard__stars{ color:var(--amber); font-size:13px; letter-spacing:2px; margin-left:auto; }\n.tcard p{ font-size:16px; color:var(--text); line-height:1.55; }\n.tcard p::before{ content:\"“\"; color:var(--orange); font-weight:700; }\n.tcard p::after{ content:\"”\"; color:var(--orange); font-weight:700; }\n.badge-net{ font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--orange); text-transform:uppercase; }\n\n/* ---------- Intro band (todo incluido) ---------- */\n.intro{ display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(32px,5vw,68px); align-items:center; }\n.intro__media{ border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow); position:relative; }\n.intro__media image-slot{ width:100%; aspect-ratio:4/3.2; }\n.intro__media .float{\n  position:absolute; left:20px; bottom:20px; z-index:3;\n  background:#fff; border-radius:14px; padding:14px 18px; box-shadow:var(--shadow);\n  display:flex; align-items:center; gap:12px;\n}\n.intro__media .float b{ font-weight:800; font-size:24px; color:var(--orange); line-height:1; }\n.intro__media .float span{ font-size:12.5px; color:var(--muted); line-height:1.2; }\n.intro p.big{ font-size:clamp(17px,1.8vw,20px); color:var(--text); line-height:1.6; margin-top:6px; }\n.intro p.big b{ font-weight:700; }\n\n/* ---------- Tipos de experiencia ---------- */\n.types{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }\n.type{ position:relative; border-radius:var(--radius-lg); overflow:hidden; min-height:480px; display:flex; flex-direction:column; justify-content:flex-end; isolation:isolate; box-shadow:var(--shadow-sm); transition:transform .35s var(--ease); }\n.type:hover{ transform:translateY(-6px); }\n.type image-slot{ position:absolute; inset:0; z-index:-2; width:100%; height:100%; }\n.type::after{ content:\"\"; position:absolute; inset:0; z-index:-1; background:linear-gradient(to top, rgba(15,12,8,.95) 12%, rgba(15,12,8,.35) 55%, rgba(15,12,8,.2) 100%); }\n.type__tag{ position:absolute; top:20px; left:20px; background:var(--orange); color:#fff; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:7px 14px; border-radius:100px; }\n.type__body{ padding:28px 26px 28px; color:#fff; }\n.type__body h3{ font-weight:700; font-size:24px; line-height:1.1; margin-bottom:10px; }\n.type__body p{ font-size:14.5px; color:rgba(255,255,255,.85); margin-bottom:16px; line-height:1.5; }\n.type__chips{ list-style:none; display:flex; flex-wrap:wrap; gap:7px; margin-bottom:20px; }\n.type__chips li{ font-size:12px; color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:100px; padding:5px 11px; }\n.type__cta{ display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:14px; color:var(--orange); transition:gap .25s; }\n.type:hover .type__cta{ gap:13px; }\n\n/* ---------- Qué incluye (grilla firma) ---------- */\n.incl{ display:grid; grid-template-columns:repeat(3,1fr); gap:30px 26px; }\n.incl__item .label{ text-align:center; font-weight:700; font-size:18px; margin-bottom:16px; color:var(--text); }\n.incl__item .media{ border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm); transition:transform .35s var(--ease), box-shadow .35s; }\n.incl__item:hover .media{ transform:translateY(-5px); box-shadow:var(--shadow); }\n.incl__item .media image-slot{ width:100%; aspect-ratio:4/3; }\n.incl__item .media{ position:relative; }\n.incl__item .desc{ font-size:14px; color:var(--muted); line-height:1.55; margin-top:14px; text-align:center; padding:0 6px; }\n\n/* ---------- Timeline (banda oscura) ---------- */\n.timeline{ display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:1px solid var(--line-d); border-radius:var(--radius-lg); overflow:hidden; background:var(--ink-2); }\n.tl__col{ padding:34px 30px 40px; border-right:1px solid var(--line-d); }\n.tl__col:last-child{ border-right:none; }\n.tl__day{ font-weight:800; font-size:26px; color:#fff; line-height:1; margin-bottom:4px; }\n.tl__date{ font-size:12px; font-weight:600; letter-spacing:.12em; color:var(--orange); text-transform:uppercase; margin-bottom:24px; }\n.tl__step{ display:flex; gap:13px; padding:12px 0; border-top:1px solid rgba(255,255,255,.08); }\n.tl__step:first-of-type{ border-top:none; }\n.tl__dot{ width:9px; height:9px; border-radius:50%; background:var(--orange); flex:none; margin-top:6px; }\n.tl__step b{ color:#fff; font-weight:700; font-size:14.5px; display:block; }\n.tl__step p{ font-size:13.5px; color:var(--muted-d); }\n\n/* ---------- Casas ---------- */\n.houses{ display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }\n.house{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; box-shadow:var(--shadow-sm); transition:transform .35s var(--ease), box-shadow .35s; }\n.house:hover{ transform:translateY(-6px); box-shadow:var(--shadow); }\n.house__media{ position:relative; aspect-ratio:4/3; }\n.house__media image-slot{ width:100%; height:100%; }\n.house__cap{ position:absolute; top:14px; left:14px; z-index:2; background:rgba(255,255,255,.95); color:var(--ink); font-size:12px; font-weight:700; padding:7px 12px; border-radius:100px; box-shadow:var(--shadow-sm); }\n.house__cap b{ color:var(--orange); }\n.house__body{ padding:22px 24px 24px; }\n.house__body h3{ font-weight:700; font-size:21px; margin-bottom:4px; }\n.house__zone{ font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-bottom:16px; }\n.house__amen{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:20px; }\n.house__amen span{ font-size:12.5px; color:var(--text); background:var(--cream); border:1px solid var(--line); border-radius:8px; padding:5px 10px; }\n.house__foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:16px; border-top:1px solid var(--line); }\n.house__foot small{ font-size:12px; color:var(--muted); font-weight:600; }\n.house__cta{ display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:13.5px; color:var(--orange); transition:gap .25s; }\n.house__cta:hover{ gap:12px; }\n\n/* ---------- Extras / actividades ---------- */\n.extras{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }\n.extra{ position:relative; aspect-ratio:1/1.12; border-radius:var(--radius); overflow:hidden; isolation:isolate; box-shadow:var(--shadow-sm); transition:transform .35s var(--ease); }\n.extra:hover{ transform:translateY(-5px); }\n.extra image-slot{ position:absolute; inset:0; z-index:-2; width:100%; height:100%; }\n.extra::after{ content:\"\"; position:absolute; inset:0; z-index:-1; background:linear-gradient(to top, rgba(15,12,8,.92) 8%, rgba(15,12,8,.1) 55%); }\n.extra__body{ padding:18px 18px 20px; color:#fff; }\n.extra__body h3{ font-weight:700; font-size:17px; line-height:1.05; margin-bottom:5px; }\n.extra__body p{ font-size:12.5px; color:rgba(255,255,255,.82); line-height:1.4; }\n\n/* ---------- Contadores ---------- */\n.stats{ position:relative; isolation:isolate; overflow:hidden; }\n.stats image-slot{ position:absolute; inset:0; z-index:-2; width:100%; height:100%; }\n.stats::after{ content:\"\"; position:absolute; inset:0; z-index:-1; background:linear-gradient(rgba(18,14,9,.86), rgba(18,14,9,.9)); }\n.stats__grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:30px; text-align:center; }\n.stat b{ display:block; font-weight:800; font-size:clamp(38px,5vw,60px); color:#fff; line-height:1; }\n.stat b .plus{ color:var(--orange); }\n.stat span{ display:block; margin-top:10px; font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted-d); }\n\n/* ---------- Galería ---------- */\n.gallery{ display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:190px; gap:14px; }\n.gallery image-slot{ width:100%; height:100%; border-radius:var(--radius); }\n.g-tall{ grid-row:span 2; }\n.g-wide{ grid-column:span 2; }\n\n/* ---------- Cómo funciona ---------- */\n.steps{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }\n.step{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:30px 26px 30px; box-shadow:var(--shadow-sm); position:relative; transition:transform .3s var(--ease); }\n.step:hover{ transform:translateY(-5px); }\n.step__n{ width:46px; height:46px; border-radius:50%; background:var(--orange); color:#fff; display:grid; place-items:center; font-weight:800; font-size:19px; margin-bottom:18px; }\n.step h3{ font-weight:700; font-size:18px; margin-bottom:8px; }\n.step p{ font-size:14.5px; color:var(--muted); line-height:1.55; }\n.step__line{ position:absolute; top:53px; right:-13px; width:26px; height:2px; background:var(--line); z-index:1; }\n.step:last-child .step__line{ display:none; }\n\n/* ---------- FAQ ---------- */\n.faq{ max-width:840px; margin:0 auto; }\n.faq__item{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden; transition:box-shadow .25s; }\n.faq__item.open{ box-shadow:var(--shadow-sm); }\n.faq__q{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:22px 24px; text-align:left; font-weight:600; font-size:17px; color:var(--text); transition:color .2s; }\n.faq__q:hover{ color:var(--orange); }\n.faq__icon{ flex:none; width:30px; height:30px; border-radius:50%; background:var(--cream); display:grid; place-items:center; position:relative; transition:background .25s; }\n.faq__icon::before, .faq__icon::after{ content:\"\"; position:absolute; background:var(--orange); border-radius:2px; transition:transform .3s var(--ease); }\n.faq__icon::before{ width:12px; height:2px; }\n.faq__icon::after{ width:2px; height:12px; }\n.faq__item.open .faq__icon{ background:var(--orange); }\n.faq__item.open .faq__icon::before, .faq__item.open .faq__icon::after{ background:#fff; }\n.faq__item.open .faq__icon::after{ transform:rotate(90deg); opacity:0; }\n.faq__a{ max-height:0; overflow:hidden; transition:max-height .4s var(--ease); }\n.faq__a p{ color:var(--muted); font-size:15.5px; padding:0 24px 24px; line-height:1.65; }\n\n/* ---------- CTA final ---------- */\n.cta-final{ position:relative; overflow:hidden; isolation:isolate; text-align:center; }\n.cta-final image-slot{ position:absolute; inset:0; z-index:-2; width:100%; height:100%; }\n.cta-final::after{ content:\"\"; position:absolute; inset:0; z-index:-1; background:linear-gradient(rgba(15,12,8,.74), rgba(15,12,8,.86)); }\n.cta-final .inner{ padding:clamp(72px,10vw,130px) 0; }\n.cta-final h2{ color:#fff; font-weight:700; font-size:clamp(32px,5vw,60px); line-height:1.04; max-width:18ch; margin:0 auto 20px; }\n.cta-final .sub{ color:rgba(255,255,255,.9); margin:0 auto 34px; }\n.cta-final .actions{ display:flex; justify-content:center; flex-wrap:wrap; gap:14px; }\n\n/* ---------- Footer ---------- */\n.footer{ background:var(--ink); color:#e7e0d6; padding:64px 0 36px; }\n.footer__top{ display:grid; grid-template-columns:1.5fr 1fr 1fr 1.1fr; gap:40px; padding-bottom:44px; border-bottom:1px solid var(--line-d); }\n.footer .logo__word b{ color:#fff; }\n.footer .logo__word small{ color:var(--muted-d); }\n.footer__brand p{ color:var(--muted-d); font-size:14.5px; max-width:34ch; margin-top:16px; }\n.footer__col h4{ font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--orange); margin-bottom:16px; }\n.footer__col a, .footer__col p{ display:block; color:var(--muted-d); font-size:14.5px; margin-bottom:10px; transition:color .2s; }\n.footer__col a:hover{ color:#fff; }\n.footer__bottom{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:28px; flex-wrap:wrap; }\n.footer__bottom p{ font-size:12.5px; color:var(--muted-d); }\n\n/* ---------- Floating WhatsApp ---------- */\n.wa-float{ position:fixed; right:22px; bottom:22px; z-index:90; display:flex; align-items:center; background:var(--wa); color:#04210f; border-radius:100px; box-shadow:0 14px 40px -10px rgba(37,211,102,.6); transition:transform .3s var(--ease), box-shadow .3s; overflow:hidden; }\n.wa-float:hover{ transform:scale(1.03); box-shadow:0 18px 50px -10px rgba(37,211,102,.75); }\n.wa-float__ic{ width:60px; height:60px; display:grid; place-items:center; flex:none; }\n.wa-float__ic svg{ width:30px; height:30px; }\n.wa-float__txt{ font-weight:700; font-size:14px; white-space:nowrap; max-width:0; opacity:0; transition:max-width .4s var(--ease), opacity .3s, padding .4s; }\n.wa-float:hover .wa-float__txt{ max-width:220px; opacity:1; padding-right:24px; }\n.wa-pulse{ position:absolute; inset:0; border-radius:100px; box-shadow:0 0 0 0 rgba(37,211,102,.5); animation:wa-pulse 2.4s infinite; pointer-events:none; }\n@keyframes wa-pulse{ 70%{ box-shadow:0 0 0 16px rgba(37,211,102,0); } 100%{ box-shadow:0 0 0 0 rgba(37,211,102,0); } }\n\n/* ---------- image-slot theming (claro) ---------- */\nimage-slot{\n  background:repeating-linear-gradient(45deg, #efe8dc 0 14px, #f3ede3 14px 28px);\n  color:#a99f8f; font-family:var(--sans); font-weight:600; font-size:11px; letter-spacing:.06em; text-transform:uppercase;\n}\n.section--dark image-slot, .type image-slot, .extra image-slot, .stats image-slot, .cta-final image-slot, .hero image-slot, .timeline image-slot{\n  background:repeating-linear-gradient(45deg, #221d16 0 14px, #28221a 14px 28px); color:#8a8073;\n}\n\n/* ---------- Reveal ---------- */\n.reveal{ opacity:0; transform:translateY(24px); transition:opacity .7s var(--ease), transform .7s var(--ease); }\n.reveal.in{ opacity:1; transform:none; }\n.reveal[data-d=\"1\"]{ transition-delay:.08s; }\n.reveal[data-d=\"2\"]{ transition-delay:.16s; }\n.reveal[data-d=\"3\"]{ transition-delay:.24s; }\n.reveal[data-d=\"4\"]{ transition-delay:.32s; }\n\n/* ---------- Responsive ---------- */\n@media (max-width:1024px){\n  .nav{ gap:20px; }\n  .nav a{ font-size:14px; }\n  .types,.houses,.tstrip,.steps{ grid-template-columns:repeat(2,1fr); }\n  .incl{ grid-template-columns:repeat(2,1fr); }\n  .extras{ grid-template-columns:repeat(3,1fr); }\n  .timeline{ grid-template-columns:1fr; }\n  .tl__col{ border-right:none; border-bottom:1px solid var(--line-d); }\n  .tl__col:last-child{ border-bottom:none; }\n  .intro{ grid-template-columns:1fr; }\n  .footer__top{ grid-template-columns:1fr 1fr; }\n  .stats__grid{ grid-template-columns:repeat(2,1fr); gap:36px 20px; }\n  .step__line{ display:none; }\n}\n@media (max-width:760px){\n  body{ font-size:16px; }\n  .nav{ display:none; }\n  .header__cta .btn{ display:none; }\n  .burger{ display:block; }\n  .types,.houses,.tstrip,.steps,.incl,.extras,.gallery{ grid-template-columns:1fr; }\n  .extras{ grid-template-columns:1fr 1fr; }\n  .gallery{ grid-auto-rows:160px; }\n  .g-wide{ grid-column:span 1; }\n  .g-tall{ grid-row:span 1; }\n  .footer__top{ grid-template-columns:1fr; gap:30px; }\n  .stats__grid{ grid-template-columns:1fr 1fr; }\n  .container{ padding:0 20px; }\n  .type{ min-height:420px; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ============ HEADER ============ -->\n<header class=\"header\" id=\"header\">\n  <div class=\"container header__inner\">\n    <a href=\"#top\" class=\"logo\" aria-label=\"Por Última Vez\">\n      <span class=\"logo__mark\">PV<\u002Fspan>\n      <span class=\"logo__word\"><b>POR ÚLTIMA VEZ<\u002Fb><small>DESPEDIDAS · CÓRDOBA<\u002Fsmall><\u002Fspan>\n    <\u002Fa>\n    <nav class=\"nav\">\n      <a href=\"#experiencias\">Experiencias<\u002Fa>\n      <a href=\"#incluye\">Qué incluye<\u002Fa>\n      <a href=\"#casas\">Casas<\u002Fa>\n      <a href=\"#extras\">Extras<\u002Fa>\n      <a href=\"#galeria\">Galería<\u002Fa>\n      <a href=\"#faq\">FAQ<\u002Fa>\n    <\u002Fnav>\n    <div class=\"header__cta\">\n      <a class=\"btn btn--orange js-wa\">Armar mi despedida<\u002Fa>\n      <button class=\"burger\" id=\"burger\" aria-label=\"Menú\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ============ MOBILE MENU ============ -->\n<div class=\"mobile-menu\" id=\"mobileMenu\">\n  <a href=\"#experiencias\"><span>01<\u002Fspan>Experiencias<\u002Fa>\n  <a href=\"#incluye\"><span>02<\u002Fspan>Qué incluye<\u002Fa>\n  <a href=\"#casas\"><span>03<\u002Fspan>Casas<\u002Fa>\n  <a href=\"#extras\"><span>04<\u002Fspan>Extras<\u002Fa>\n  <a href=\"#galeria\"><span>05<\u002Fspan>Galería<\u002Fa>\n  <a href=\"#faq\"><span>06<\u002Fspan>FAQ<\u002Fa>\n  <a class=\"btn btn--orange btn--lg js-wa\">Armar mi despedida<\u002Fa>\n<\u002Fdiv>\n\n<span id=\"top\"><\u002Fspan>\n\n<!-- ============ HERO ============ -->\n<section class=\"hero\">\n  <div class=\"hero__bg\" id=\"heroSlider\">\n    <div class=\"hero-slide active\"><image-slot id=\"hero-1\" shape=\"rect\" placeholder=\"FOTO GRUPO 1 — despedida, grupo feliz brindando\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"hero-slide\"><image-slot id=\"hero-2\" shape=\"rect\" placeholder=\"FOTO GRUPO 2 — asado / pileta / amigos\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"hero-slide\"><image-slot id=\"hero-3\" shape=\"rect\" placeholder=\"FOTO GRUPO 3 — noche / boliche\"><\u002Fimage-slot><\u002Fdiv>\n    <div class=\"hero-slide\"><image-slot id=\"hero-4\" shape=\"rect\" placeholder=\"FOTO GRUPO 4 — casa / llegada\"><\u002Fimage-slot><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hero__overlay\"><\u002Fdiv>\n  <div class=\"hero__dots\" id=\"heroDots\"><\u002Fdiv>\n  <div class=\"container hero__inner\">\n    <span class=\"hero__eyebrow\"><b>●<\u002Fb> Despedidas de soltero · Córdoba, Argentina<\u002Fspan>\n    <h1>La despedida que van a contar <span class=\"ac\">toda la vida<\u002Fspan><\u002Fh1>\n    <p class=\"hero__sub\">Casas de primer nivel, comidas, traslados, boliches y actividades. Ustedes vienen a disfrutar. Nosotros organizamos todo.<\u002Fp>\n    <div class=\"hero__actions\">\n      <a class=\"btn btn--orange btn--lg js-wa\">Quiero armar mi despedida<\u002Fa>\n      <a href=\"#incluye\" class=\"btn btn--outline btn--lg\">Ver qué incluye<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"scroll-hint\"><span>Scroll<\u002Fspan><span class=\"arrow\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ TESTIMONIOS (TIRA) ============ -->\n<section class=\"section section--cream\" style=\"padding-top:clamp(48px,6vw,72px); padding-bottom:clamp(48px,6vw,72px);\">\n  <div class=\"container\">\n    <div class=\"tstrip\">\n      <article class=\"tcard reveal\" data-d=\"1\">\n        <div class=\"tcard__top\">\n          <span class=\"tcard__av\"><image-slot id=\"tst-1\" shape=\"rect\" placeholder=\"FOTO\"><\u002Fimage-slot><\u002Fspan>\n          <div><b>Grupo de Martín<\u002Fb><span><span class=\"badge-net\">vía WhatsApp<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <span class=\"tcard__stars\">★★★★★<\u002Fspan>\n        <\u002Fdiv>\n        <p>Llegamos y estaba todo resuelto. Casa, comida, traslados y boliche. No tuvimos que preocuparnos por nada.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"tcard reveal\" data-d=\"2\">\n        <div class=\"tcard__top\">\n          <span class=\"tcard__av\"><image-slot id=\"tst-2\" shape=\"rect\" placeholder=\"FOTO\"><\u002Fimage-slot><\u002Fspan>\n          <div><b>Grupo de Fede<\u002Fb><span><span class=\"badge-net\">vía Instagram<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <span class=\"tcard__stars\">★★★★★<\u002Fspan>\n        <\u002Fdiv>\n        <p>El mejor fin de semana del grupo. Córdoba fue una locura. Ya estamos viendo con qué excusa volver.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"tcard reveal\" data-d=\"3\">\n        <div class=\"tcard__top\">\n          <span class=\"tcard__av\"><image-slot id=\"tst-3\" shape=\"rect\" placeholder=\"FOTO\"><\u002Fimage-slot><\u002Fspan>\n          <div><b>Grupo de Nico<\u002Fb><span><span class=\"badge-net\">vía Google<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <span class=\"tcard__stars\">★★★★★<\u002Fspan>\n        <\u002Fdiv>\n        <p>Pensamos que iba a ser complicado organizar todo desde otra provincia, pero nos resolvieron absolutamente todo.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ INTRO / TODO INCLUIDO ============ -->\n<section class=\"section section--white\" id=\"que-hacemos\">\n  <div class=\"container\">\n    <div class=\"intro\">\n      <div class=\"intro__media reveal\">\n        <image-slot id=\"intro-img\" shape=\"rect\" placeholder=\"FOTO — grupo brindando / llegada a la casa\"><\u002Fimage-slot>\n        <div class=\"float\">\n          <b>8–20<\u002Fb><span>personas<br>por grupo<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class= t id=\"gal-5\" class=\"g-tall\" shape=\"rect\" placeholder=\"PILETA\"><\u002Fimage-slot>\n      <image-slot id=\"gal-6\" shape=\"rect\" placeholder=\"NOCHE\"><\u002Fimage-slot>\n      <image-slot id=\"gal-7\" shape=\"rect\" placeholder=\"CASA\"><\u002Fimage-slot>\n      <image-slot id=\"gal-8\" class=\"g-wide\" shape=\"rect\" placeholder=\"ACTIVIDAD\"><\u002Fimage-slot>\n      <image-slot id=\"gal-9\" shape=\"rect\" placeholder=\"AMIGOS\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CÓMO FUNCIONA ============ -->\n<section class=\"section section--white\" id=\"como-funciona\">\n  <div class=\"container\">\n    <div class=\"head head--center reveal\">\n      <span class=\"eyebrow eyebrow--center\">Cómo funciona<\u002Fspan>\n      <h2 class=\"title\">Organizarlo <span class=\"ac\">es simple<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"steps\">\n      <div class=\"step reveal\" data-d=\"1\"><span class=\"step__line\"><\u002Fspan><div class=\"step__n\">1<\u002Fdiv><h3>Nos escribís<\u002Fh3><p>Contanos fecha, cantidad de personas y qué tipo de despedida quieren.<\u002Fp><\u002Fdiv>\n      <div class=\"step reveal\" data-d=\"2\"><span class=\"step__line\"><\u002Fspan><div class=\"step__n\">2<\u002Fdiv><h3>Armamos la propuesta<\u002Fh3><p>Diseñamos una experiencia a medida: casa, comidas, traslados, actividades y noche.<\u002Fp><\u002Fdiv>\n      <div class=\"step reveal\" data-d=\"3\"><span class=\"step__line\"><\u002Fspan><div class=\"step__n\">3<\u002Fdiv><h3>Reservan<\u002Fh3><p>Confirman la fecha con una seña y queda todo agendado.<\u002Fp><\u002Fdiv>\n      <div class=\"step reveal\" data-d=\"4\"><div class=\"step__n\">4<\u002Fdiv><h3>Vienen a Córdoba<\u002Fh3><p>Nosotros coordinamos todo para que ustedes solo se dediquen a disfrutar.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"reveal\" style=\"text-align:center; margin-top:44px;\">\n      <a class=\"btn btn--wa btn--lg js-wa\"><svg viewBox=\"0 0 24 2 v class=\"faq__a\"><p>Sí. Podemos incluir casas de primer nivel en Córdoba según cantidad de personas, fechas y disponibilidad.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"faq__item\"><button class=\"faq__q\">¿Organizan traslados?<span class=\"faq__icon\"><\u002Fspan><\u002Fbutton><div class=\"faq__a\"><p>Sí. Coordinamos traslados desde el aeropuerto o terminal hasta la casa, y también traslados a boliches o actividades.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"faq__item\"><button class=\"faq__q\">¿La propuesta es fija o personalizada?<span class=\"faq__icon\"><\u002Fspan><\u002Fbutton><div class=\"faq__a\"><p>Es personalizada. Diseñamos cada despedida según el grupo, presupuesto, fechas y tipo de experiencia que quieran vivir.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"faq__item\"><button class=\"faq__q\">¿Incluye comidas?<span class=\"faq__icon\"><\u002Fspan><\u002Fbutton><div class=\"faq__a\"><p>Sí. Podemos incluir asados, comidas, desayunos, bebidas y opciones con cocineros privados.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"faq__item\"><button class=\"faq__q\">¿Pueden sumar actividades?<span class=\"faq__icon\"><\u002Fspan><\u002Fbutton><div class=\"faq__a\"><p>Sí. Podemos sumar karting, paintball, pesca, bowling, pool day, boliches y otras actividades según disponibilidad.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"faq__item\"><button class=\"faq__q\">¿Cómo se reserva?<span class=\"faq__icon\"><\u002Fspan><\u002Fbutton><div class=\"faq__a\"><p>La reserva se confirma con una seña. El saldo se abona según las condiciones acordadas en la propuesta.<\u002Fp><\u002Fdiv><\u002Fdiv>\n      <div class=\"faq__item\"><button class=\"faq__q\">¿Publican precios en la web?<span class=\"faq__icon\"><\u002Fspan><\u002Fbutton><div class=\"faq__a\"><p>No publicamos precios fijos porque cada experiencia depende de cantidad de personas, fechas, casa elegida y actividades incluidas. Te armamos una propuesta a medida por WhatsApp.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ CTA FINAL ============ -->\n<section class=\"section cta-final\" id=\"contacto\">\n  <image-slot id=\"cta-bg\" shape=\"rect\" placeholder=\"FOTO / VIDEO — grupo, noche, fiesta\"><\u002Fimage-slot>\n  <div class=\"container inner reveal\">\n    <span class=\"eyebrow eyebrow--center\">Última llamada<\u002Fspan>\n    <h2>La despedida <span class=\"ac\">no se improvisa<\u002Fspan><\u002Fh2>\n    <p class=\"sub\">Contanos fecha, cantidad de personas y qué tipo de experiencia quieren. Nosotros armamos el resto.<\u002Fp>\n    <div class=\"actions\">\n      <a class=\"btn btn--wa btn--lg js-wa\"><svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M.057 24l1.687-6.163a11.867 11.867 0 0 1-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.817 11.817 0 0 1 8.413 3.488 11.824 11.824 0 0 1 3.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 0 1-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 0 0 1.51 5.26l-.999 3.648 3.748-.607zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z\"><\u002Fpath><\u002Fsvg> Armar mi despedida<\u002Fa>\n      <a href=\"#casas\" class=\"btn btn--outline btn--lg\">Ver las casas<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FOOTER =========
